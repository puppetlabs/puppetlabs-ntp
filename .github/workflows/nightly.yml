name: "nightly"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    with:
      runs_on: "ubuntu-24.04"
      flags: "--nightly"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    with:
      runs_on: "ubuntu-24.04"
      # --matrix: local copy of puppet_litmus's matrix.json with the docker SLES-15 image
      # removed, so SLES-15 falls back to the provision_service VM instead of the
      # unregistered litmusimage/sles:15 container (which lacks SUSEConnect).
      flags: "--nightly --matrix .github/matrix.json --platform-exclude centos-7 --platform-exclude oraclelinux-7 --platform-exclude scientific-7"
    secrets: "inherit"
